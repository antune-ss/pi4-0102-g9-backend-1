# Define a porta de rede e as interfaces em que o broker MQTT aceitará conexões.
# 1883: Porta padrão oficial (IANA) para comunicação MQTT não criptografada (TCP simples).
# 0.0.0.0: Indica que o broker deve escutar em todas as interfaces de rede IPv4 da máquina/container (bind all). No contexto de Docker, isso é indispensável: se omitido ou configurado como 127.0.0.1, o Mosquitto aceitaria conexões apenas originadas de dentro do próprio container, bloqueando a comunicação do host, de outros containers ou de dispositivos IoT externos.
listener 1883 0.0.0.0

# Permite que clientes se conectem ao broker sem fornecer credenciais (usuário e senha).
allow_anonymous true

# Habilita a gravação do estado do broker em disco em um arquivo de banco de dados (mosquitto.db).
# O que é salvo: Mensagens retidas (retained messages), inscrições de clientes com sessões persistentes (clean session = false) e mensagens QoS 1 ou QoS 2 pendentes de confirmação.
# Benefício: Se o broker for reiniciado (por exemplo, ao reiniciar o container), o estado das conexões e as últimas leituras de sensores retidas não são perdidos na memória.
persistence true
persistence_location /mosquitto/data/

# Redireciona os eventos de log do broker para a saída padrão (standard output / console).
# Essencial para ambientes Docker, pois permite acompanhar os eventos, avisos e conexões em tempo real via comando docker logs ou docker compose logs mosquitto.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log